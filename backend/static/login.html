<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In — Raah</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="/static/index.html" class="brand">
      <span>Raah</span>
      <span class="brand-badge">FastAPI Portal</span>
    </a>
  </header>

  <main class="container" style="max-width: 450px;">
    <div class="card">
      <h2 style="font-weight: 800; font-size: 1.75rem; margin-bottom: 0.5rem;">Sign In</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
        Enter your credentials to access your assessment dashboard.
      </p>

      <div id="alertBox" style="display: none; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@raah.edu" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Sign In</button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center;">
        <button id="demoBtn" type="button" class="btn" style="width: 100%; background: #eaedff; color: var(--primary); justify-content: center;">
          ⚡ Explore as Demo Student
        </button>
      </div>
    </div>
  </main>

  <script type="module">
    import { Auth } from '/static/js/auth.js';

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const demoBtn = document.getElementById('demoBtn');

    function showAlert(msg, isError = true) {
      alertBox.style.display = 'block';
      alertBox.style.background = isError ? '#fef2f2' : '#f0fdf4';
      alertBox.style.color = isError ? '#991b1b' : '#166534';
      alertBox.textContent = msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await Auth.login(email, password);
        window.location.href = '/static/dashboard.html';
      } catch (err) {
        showAlert(err.message);
      }
    });

    demoBtn.addEventListener('click', () => {
      localStorage.setItem('raah_token', 'demo-token');
      localStorage.setItem('raah_user', JSON.stringify({ email: 'student@raah.edu', full_name: 'Student Explorer' }));
      window.location.href = '/static/dashboard.html';
    });
  </script>
</body>
</html>
